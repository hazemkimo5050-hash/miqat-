<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميقات - مواقيت الصلاة والأذكار</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f3;--card:#fff;--ink:#12303d;--mute:#5d7480;--line:#d5e1e3;--acc:#1f6f78;--gold:#a97f1c;--hero:#0f2a3f;--herotx:#f2ead3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a24;--card:#12293a;--ink:#e6eff1;--mute:#93a9b3;--line:#22404f;--acc:#5cc2cb;--gold:#e0b84f;--hero:#071219;--herotx:#f2ead3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a24;--card:#12293a;--ink:#e6eff1;--mute:#93a9b3;--line:#22404f;--acc:#5cc2cb;--gold:#e0b84f;--hero:#071219;--herotx:#f2ead3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 96px}
.hero{background:var(--hero);color:var(--herotx);margin:0 -16px;padding:24px 20px 28px;border-radius:0 0 28px 28px;text-align:center}
.hero select{background:transparent;color:inherit;border:1px solid #f2ead355;border-radius:20px;padding:4px 14px;font:inherit}
.hero select option{color:#12303d}
.brand{font-family:"Noto Naskh Arabic",serif;font-size:34px;line-height:1.2;color:var(--gold);margin-bottom:10px}
.hero small{display:block;opacity:.75;margin-top:6px}
.nextname{font-size:20px;margin-top:14px}
.count{font-size:52px;font-weight:600;letter-spacing:1px;line-height:1.2;font-variant-numeric:tabular-nums}
.times{list-style:none;margin:18px 0 0;padding:0;background:var(--card);border-radius:18px;border:1px solid var(--line)}
.times li{display:flex;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.times li:last-child{border:0}
.times li.on{background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:600;border-radius:18px}
.times li.sun{color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:8px 2px;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--acc);font-weight:600;background:color-mix(in srgb,var(--acc) 12%,transparent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section[hidden]{display:none}
h2{font-size:20px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.naskh{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:22px;line-height:2.2}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:22px;padding:8px 20px;font:inherit;cursor:pointer}
.compass{width:240px;height:240px;margin:20px auto;border-radius:50%;border:2px solid var(--line);background:var(--card);position:relative}
.compass .n{position:absolute;top:8px;left:0;right:0;text-align:center;color:var(--mute);font-size:13px}
.arrow{position:absolute;inset:0;display:grid;place-items:center;transition:transform .2s}
.arrow svg{width:70px;height:200px}
.big{font-size:64px;font-weight:600;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
.tasbih{width:180px;height:180px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font:600 56px "IBM Plex Sans Arabic",sans-serif;display:block;margin:16px auto;cursor:pointer}
.tasbih:active{transform:scale(.97)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cnt{color:var(--gold);font-weight:600}
.secbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;font:inherit;font-size:18px;color:var(--ink);cursor:pointer;text-align:right}
.secbtn .em{font-size:30px}.secbtn .ct{margin-right:auto;color:var(--mute);font-size:14px}
.zk{cursor:pointer;user-select:none}.zk.done{opacity:.55}
.zrow{display:flex;justify-content:space-between;margin-top:6px;color:var(--mute);font-size:14px}
.zk .naskh{font-size:21px}
.naskh,.zk .naskh{font-size:var(--nsz,22px)!important}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font:500 18px "Noto Naskh Arabic",serif}
.sr{display:flex;gap:12px;align-items:flex-start}.chk{background:none;border:0;font-size:26px;cursor:pointer;padding:0;line-height:1.2}.sx{flex:1;cursor:pointer}.hdc{cursor:pointer}
.ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.ex[hidden]{display:none}
.cp{background:none;border:0;font-size:18px;cursor:pointer;padding:0 4px}
</style>
</head>
<body>
<main>
<div class="hero">
  <div class="brand">ميقات</div>
  <select id="city" aria-label="المدينة"></select>
  <small id="dates"></small>
  <small id="fast"></small>
  <div class="nextname" id="nextname"></div>
  <div class="count" id="count">--:--:--</div>
  <button class="btn" id="shareApp" style="margin-top:14px;font-size:14px;padding:6px 16px">📋 نسخ رابط الموقع</button>
</div>

<section id="t-times">
  <ul class="times" id="list"></ul>
  <div class="card" id="hadith" style="margin-top:14px"></div>
  <p style="color:var(--mute);font-size:13px">الحساب بطريقة الهيئة المصرية العامة للمساحة، ويتم داخل المتصفح بدون اتصال. قد يختلف عن التقويم الرسمي بدقيقة أو دقيقتين.</p>
</section>

<section id="t-qibla" hidden>
  <h2>اتجاه القبلة</h2>
  <div class="compass"><div class="n">شمال</div>
    <div class="arrow" id="arrow"><svg viewBox="0 0 70 200"><path d="M35 8 L58 100 H12 Z" fill="var(--gold)"/><rect x="29" y="100" width="12" height="90" rx="6" fill="var(--line)"/></svg></div></div>
  <p class="big" id="deg">--</p>
  <p style="text-align:center;color:var(--mute)" id="qnote">الزاوية من الشمال مع اتجاه عقارب الساعة، حسب المدينة المختارة.</p>
  <div class="row"><button class="btn" id="compBtn">تشغيل البوصلة</button></div>
</section>

<section id="t-azkar" hidden>
  <div id="azkar"></div>
</section>

<section id="t-tasbih" hidden>
  <h2>السبحة</h2>
  <div class="row" id="tchoice"></div>
  <div class="row" style="margin-top:10px">الهدف: <select id="tgt" class="in" style="width:auto"><option value="0">بدون</option><option value="33">٣٣</option><option value="100">١٠٠</option><option value="1000">١٠٠٠</option></select></div>
  <button class="tasbih" id="tbtn" aria-label="سبّح">0</button>
  <p style="text-align:center">إجمالي اليوم: <span class="cnt" id="ttotal">0</span></p>
  <div class="row"><button class="btn" id="treset">تصفير العداد</button></div>
</section>

<section id="t-more" hidden>
  <div id="more"></div>
</section>
</main>

<nav role="tablist" id="nav"></nav>

<script>
const $=id=>document.getElementById(id);
const CITIES=[
["القاهرة",30.0444,31.2357,"Africa/Cairo"],["المنصورة",31.0409,31.3785,"Africa/Cairo"],["الإسكندرية",31.2001,29.9187,"Africa/Cairo"],
["الجيزة",30.0131,31.2089,"Africa/Cairo"],["أسوان",24.0889,32.8998,"Africa/Cairo"],["الأقصر",25.6872,32.6396,"Africa/Cairo"],
["مكة المكرمة",21.3891,39.8579,"Asia/Riyadh"],["المدينة المنورة",24.4672,39.6024,"Asia/Riyadh"],["الرياض",24.7136,46.6753,"Asia/Riyadh"],
["دبي",25.2048,55.2708,"Asia/Dubai"],["الكويت",29.3759,47.9774,"Asia/Kuwait"],["عمّان",31.9454,35.9284,"Asia/Amman"],
["القدس",31.7683,35.2137,"Asia/Jerusalem"],["بغداد",33.3152,44.3661,"Asia/Baghdad"],["الدار البيضاء",33.5731,-7.5898,"Africa/Casablanca"],
["تونس",36.8065,10.1815,"Africa/Tunis"],["الجزائر",36.7538,3.0588,"Africa/Algiers"],["إسطنبول",41.0082,28.9784,"Europe/Istanbul"],
["لندن",51.5072,-0.1276,"Europe/London"],["نيويورك",40.7128,-74.006,"America/New_York"]];
const PN=["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,fix=(x,m)=>((x%m)+m)%m;
let city={name:"المنصورة",lat:31.0409,lng:31.3785,tz:"Africa/Cairo"},tick;

function ymd(date,tz){const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(date).split("-");return p.map(Number)}
function calc(y,m,d,lat,lng){
  const jd=Date.UTC(y,m-1,d,12)/86400000+2440587.5, D=jd-2451545;
  const g=rad(fix(357.529+0.98560028*D,360)), q=fix(280.459+0.98564736*D,360);
  const L=rad(fix(q+1.915*Math.sin(g)+0.02*Math.sin(2*g),360)), e=rad(23.439-3.6e-7*D);
  const decl=Math.asin(Math.sin(e)*Math.sin(L));
  const ra=fix(deg(Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)))/15,24);
  const eqt=q/15-ra, noon=12-lng/15-eqt;
  const T=a=>{const c=(-Math.sin(rad(a))-Math.sin(decl)*Math.sin(rad(lat)))/(Math.cos(decl)*Math.cos(rad(lat)));return deg(Math.acos(Math.max(-1,Math.min(1,c))))/15};
  const A=Math.atan(1/(ASRF+Math.tan(Math.abs(rad(lat)-decl))));
  const ca=(Math.sin(A)-Math.sin(decl)*Math.sin(rad(lat)))/(Math.cos(decl)*Math.cos(rad(lat)));
  const asr=noon+deg(Math.acos(Math.max(-1,Math.min(1,ca))))/15;
  const h=[noon-T(METH[0]),noon-T(0.833),noon,asr,noon+T(0.833)+0.017,(METH[1]==="90"?noon+T(0.833)+1.517:noon+T(METH[1]))];
  return h.map(x=>Date.UTC(y,m-1,d)+x*3600000);
}
function dayTimes(offset){
  const [y,m,d]=ymd(new Date(Date.now()+offset*864e5),city.tz);
  return calc(y,m,d,city.lat,city.lng);
}
const fmt=t=>new Date(t).toLocaleTimeString("ar-EG",{timeZone:city.tz,hour:"numeric",minute:"2-digit",hour12:!ST.h24});
const pad=n=>String(n).padStart(2,"0");

function render(){
  const today=dayTimes(0),tom=dayTimes(1),now=Date.now();
  const idx=[0,2,3,4,5];
  let next=idx.find(i=>today[i]>now),nt;
  if(next===undefined){next=0;nt=tom[0]}else nt=today[next];
  let cur=-1;idx.forEach(i=>{if(today[i]<=now)cur=i});
  $("list").innerHTML=today.map((t,i)=>`<li class="${i===1?"sun":""} ${i===cur?"on":""}"><span>${PN[i]}</span><span>${fmt(t)}</span></li>`).join("");
  $("nextname").textContent="باقي على صلاة "+PN[next];
  $("dates").textContent=new Date().toLocaleDateString("ar-EG-u-ca-islamic-umalqura",{timeZone:city.tz,day:"numeric",month:"long",year:"numeric"})+" — "+new Date().toLocaleDateString("ar-EG",{timeZone:city.tz,weekday:"long",day:"numeric",month:"long"});
  fastBadge();const upd=()=>{let s=Math.max(0,Math.floor((nt-Date.now())/1000));$("count").textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);if(s===0){if(window.NOTIFY&&window.Notification&&Notification.permission==="granted")try{new Notification("حان موعد صلاة "+PN[next],{body:city.name})}catch(e){}render()}};
  clearInterval(tick);upd();tick=setInterval(upd,1000);
  qibla();sched();
}
function bearing(){
  const k1=rad(21.4225),k2=rad(39.8262),p=rad(city.lat),dl=k2-rad(city.lng);
  return fix(deg(Math.atan2(Math.sin(dl),Math.cos(p)*Math.tan(k1)-Math.sin(p)*Math.cos(dl))),360);
}
let heading=0;
function qibla(){const b=bearing();$("deg").textContent=Math.round(b).toLocaleString("ar-EG")+"°";$("arrow").style.transform=`rotate(${b-heading}deg)`}
$("compBtn").onclick=async()=>{
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()!=="granted")return}}catch(e){}
  const h=e=>{const v=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);if(v!=null){heading=v;qibla()}};
  addEventListener("deviceorientationabsolute",h,true);addEventListener("deviceorientation",h,true);
  $("qnote").textContent="السهم يشير إلى القبلة. اترك الهاتف مسطحًا وبعيدًا عن المعادن.";
};

// city select
CITIES.forEach((c,i)=>$("city").add(new Option(c[0],i)));
$("city").add(new Option("موقعي الحالي","gps"));
$("city").value=CITIES.findIndex(c=>c[0]==="المنصورة");
$("city").onchange=e=>{
  const v=e.target.value;
  try{localStorage.setItem("city",v)}catch(x){}
  if(v==="gps"){
    navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
      city={name:"موقعي",lat:p.coords.latitude,lng:p.coords.longitude,tz:Intl.DateTimeFormat().resolvedOptions().timeZone};render()},
      ()=>{alert("تعذر تحديد موقعك. اختر مدينتك من القائمة.");$("city").value=CITIES.findIndex(c=>c[0]==="المنصورة")});
  }else{const c=CITIES[v];city={name:c[0],lat:c[1],lng:c[2],tz:c[3]};render()}
};

// tabs
const TABS=[["times","المواقيت"],["qibla","القبلة"],["azkar","الأذكار"],["tasbih","السبحة"],["more","المزيد"]];
$("nav").innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${t[0]}" aria-selected="${i===0}">${t[1]}</button>`).join("");
$("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  TABS.forEach(x=>{$("t-"+x[0]).hidden=x[0]!==t});
  [...$("nav").children].forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  document.querySelector(".hero").style.display=t==="times"?"":"none";scrollTo(0,0)};

// azkar
const tx=t=>t==="@K"?Q[1][1]:t==="@M"?[2,3,4].map(i=>`<b>${Q[i][0]}</b><br>${Q[i][1]}`).join("<br>"):t;
const SB=[["سُبْحَانَ اللَّهِ",33],["الْحَمْدُ لِلَّهِ",33],["اللَّهُ أَكْبَرُ",34]];
const TAH="لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ";
function dayz(m){const a=m?"أَصْبَحْنَا وَأَصْبَحَ":"أَمْسَيْنَا وَأَمْسَى",w=m?"هَذَا الْيَوْمِ":"هَذِهِ اللَّيْلَةِ",x=m?"بَعْدَهُ":"بَعْدَهَا";
 return [["@K",1],["@M",3],
 [`${a} الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، ${TAH}، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي ${w} وَخَيْرَ مَا ${x}، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي ${w} وَشَرِّ مَا ${x}، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ`,1],
 [m?"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",1],
 ["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1],
 ["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ",3],
 ["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3],
 ["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيًّا",3],
 ...(m?[]:[["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3]]),
 ["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100],[TAH,10],["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100],
 ["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ",10]]}
const SEC=[
["morning","🌅","أذكار الصباح",dayz(true)],
["evening","🌇","أذكار المساء",dayz(false)],
["sleep","😴","أذكار النوم",[["@K",1],["@M",3],
 ["بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ",1],

async function schedule(){
  const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
  try{
    const pr=await LN.requestPermissions();if(pr.display!=="granted")return;
    await LN.createChannel({id:"adhan",name:"الأذان",importance:5,sound:"adhan.mp3",vibration:true,visibility:1});
    await LN.createChannel({id:"azkar",name:"تذكير الأذكار",importance:3});
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications});
    const L=[],now=Date.now(),M=6e4;let id=1;
    const add=(t,title,body,ch)=>{if(t>now)L.push({id:id++,title,body,schedule:{at:new Date(t),allowWhileIdle:true},channelId:ch})};
    for(let k=0;k<14;k++){const t=dayTimes(k);
      [0,2,3,4,5].forEach((i,j)=>{
        if(ST.nf.a[j])add(t[i],"🕌 حان وقت الأذان","حان الآن موعد صلاة "+P5[j]+" — "+city.name,"adhan");
        if(ST.nf.p)add(t[i]+10*M,"📿 أذكار بعد الصلاة","لا تنسَ أذكار ما بعد صلاة "+P5[j],"azkar")});
      if(ST.nf.z[0])add(t[0]+20*M,"🌅 أذكار الصباح","حان وقت أذكار الصباح","azkar");
      if(ST.nf.z[1])add(t[3]+20*M,"🌇 أذكار المساء","حان وقت أذكار المساء","azkar");
      if(ST.nf.z[2])add(t[5]+60*M,"😴 أذكار النوم","لا تنسَ أذكار النوم","azkar")}
    if(L.length)await LN.schedule({notifications:L});
  }catch(e){}
}
