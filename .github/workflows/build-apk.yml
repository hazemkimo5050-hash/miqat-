name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Firebase plugins (only if google-services.json exists)
        run: |
          if [ -f google-services.json ]; then
            npm install --save --ignore-scripts @capacitor-firebase/authentication@^6.1.0 @capacitor-firebase/firestore@^6.1.0
          fi
      - run: npx cap add android
      - name: Signing key, Firebase file, permissions and sounds
        run: |
          mkdir -p ~/.android
          if [ -f resources/debug.keystore ]; then cp resources/debug.keystore ~/.android/debug.keystore; fi
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          if [ -f resources/debug.keystore ]; then
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../resources/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          fi
          if [ -f resources/debug.keystore ]; then
            printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("../../resources/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> android/app/build.gradle
          fi
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          P=''
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            P="$P<uses-permission android:name=\"android.permission.$p\"/>"
          done
          sed -i "s#<application#$P<application#" $M
          mkdir -p android/app/src/main/res/raw
          if [ -f resources/adhan.mp3 ]; then
            cp resources/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          else
            sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null
            ffmpeg -f lavfi -i "sine=frequency=660:duration=5" -q:a 6 android/app/src/main/res/raw/adhan.mp3
          fi
          if [ -f resources/alarm.mp3 ]; then
            cp resources/alarm.mp3 android/app/src/main/res/raw/alarm.mp3
          else
            cp android/app/src/main/res/raw/adhan.mp3 android/app/src/main/res/raw/alarm.mp3
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Signing diagnostics
        run: |
          echo "=== keystore in repo ==="
          if [ -f resources/debug.keystore ]; then keytool -list -v -keystore resources/debug.keystore -storepass android | grep -i "SHA1"; else echo "MISSING resources/debug.keystore"; fi
          echo "=== APK signing certificate ==="
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs $APK | grep -i "SHA-1" || true
          echo "=== certificate_hash in google-services.json ==="
          grep -o '"certificate_hash": "[0-9a-f]*"' google-services.json || echo "none found"
      - uses: actions/upload-artifact@v4
        with:
          name: miqat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
